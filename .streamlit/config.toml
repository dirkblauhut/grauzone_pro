# Keine Nutzungsstatistik an Streamlit senden (Grauzone läuft rein lokal)
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
# Nur auf diesem Rechner erreichbar, nicht im Netzwerk
address = "localhost"
port = 8501
# headless: keine E-Mail-Abfrage beim ersten Start; den Browser öffnen die
# Startskripte selbst, sobald Grauzone bereit ist.
headless = true

[theme]
# Heller Stil mit Dunkelblau (Testversion, Branch redesign)
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#eef2f7"
textColor = "#101828"
baseRadius = "0.6rem"
